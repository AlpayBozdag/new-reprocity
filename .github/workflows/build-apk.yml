name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Proje dosyalarını indir
        uses: actions/checkout@v4

      - name: Resmi Buildozer ile APK derle
        run: |
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: AYNA-V5-3-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
